---

- name: Load build_list from file
  include_vars:
    file: build_list.yml

- name: Load all_artifacts from file
  include_vars:
    file: all_artifacts.yml

- name: Set Nexus Authorization header
  set_fact:
    nexus_auth_header: "Basic {{ (nexus_username + ':' + nexus_password) | b64encode }}"

      #- name: Convert build_list to a list (if it's a string)
      # set_fact:
      # build_list: "{{ build_list.split(',') }}"  # Split string into list

- name: Filter artifacts based on build_list
  set_fact:
    artifact_list: "{{ all_artifacts | selectattr('name', 'in', build_list) | list }}"

- name: Ensure necessary directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/microservices
    - /opt/tomcat/webapps

- name: Download selected artifacts
  get_url:
    url: "{{ nexus_base_url }}/{{ item.path }}/{{ item.name }}.{{ item.extension }}"
    dest: "/tmp/{{ item.name }}.{{ item.extension }}"
    headers:
      Authorization: "{{ nexus_auth_header }}"
    mode: '0755'
    force: yes
  loop: "{{ artifact_list }}"

- name: Ensure unzip is installed
  package:
    name: unzip
    state: present


- name: Handle downloaded artifacts
  block:
    - name: Move JAR or WAR to target location
      command: >
        mv /tmp/{{ item.name }}.{{ item.extension }} /opt/{{ 'microservices' if item.extension == 'jar' else 'tomcat/webapps' }}/{{ item.name }}.{{ item.extension }}
      when: item.extension in ['jar', 'war']
      loop: "{{ artifact_list }}"

    - name: Unzip frontend artifact
      unarchive:
        src: "/tmp/{{ item.name }}.zip"
        dest: "/opt/tomcat/webapps/"
        remote_src: yes
      when: item.extension == 'zip'
      loop: "{{ artifact_list }}"

