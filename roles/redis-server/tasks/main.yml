---

- name: Update apt cache
  apt:
    update_cache: yes

- name: Add Redis GPG key
  ansible.builtin.apt_key:
    url: https://packages.redis.io/gpg
    state: present
    keyring: /usr/share/keyrings/redis-archive-keyring.gpg

- name: Add Redis APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb {{ ansible_distribution_release }} main"
    filename: redis
    state: present

- name: Update package index after adding Redis repo
  apt:
    update_cache: yes

- name: Install Redis tools {{ redis_version }}
  apt:
    name: "redis-tools={{ redis_version }}"
    state: present

- name: Install Redis server {{ redis_version }}
  apt:
    name: "redis-server={{ redis_version }}"
    state: present

- name: Enable and start Redis service
  systemd:
    name: redis-server
    enabled: yes
    state: started

- name: Configure Redis binding to all interfaces
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^bind '
    line: 'bind 0.0.0.0'

- name: Disable protected mode
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^protected-mode '
    line: 'protected-mode no'

- name: Set Redis password
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^# requirepass .*'
    line: "requirepass {{ redis_password }}"
    insertafter: '^# requirepass'

- name: Enable append-only file persistence
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^appendonly '
    line: 'appendonly yes'

- name: Restart Redis to apply configuration changes
  systemd:
    name: redis-server
    state: restarted

