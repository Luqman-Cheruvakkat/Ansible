- name: Create systemd service files
  template:
    src: service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
  loop: "{{ services }}"
  notify: Reload systemd

- name: Enable and start services
  systemd:
    name: "{{ item.name }}"
    enabled: yes
    state: started
  loop: "{{ services }}"
