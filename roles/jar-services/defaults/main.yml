---
services:
  - name: fibi-auth
    port: 9902
    jar_path: /opt/microservices/fibi-auth-service.jar
    after: fibi-config.service
    requires: fibi-config.service
    environment:
      - key: DB_HOST
        value: "{{ db_host }}"
      - key: DB_PORT
        value: "{{ db_port }}"
      - key: DB_USER
        value: "{{ db_user }}"
      - key: DB_PWD
        value: "{{ db_pwd }}"
      - key: DB_NAME
        value: "{{ db_name }}"
      - key: CONFIG_SERVER_URL
        value: "{{ config_server_url }}"
      - key: EUREKA_SERVER_ADDRESS
        value: "{{ eureka_server_address }}"

  - name: fibi-registry
    port: 8763
    jar_path: /opt/microservices/fibi-service-registry.jar
    environment: []

  - name: fibi-api
    port: 9905
    jar_path: /opt/microservices/fibi-api-gateway.jar
    after: fibi-auth.service
    requires: fibi-auth.service
    environment:
      - key: CONFIG_SERVER_URL
        value: "{{ config_server_url }}"
      - key: EUREKA_SERVER_ADDRESS
        value: "{{ eureka_server_address }}"

  - name: fibi-config
    port: 9302
    jar_path: /opt/microservices/fibi-config-server.jar $CONFIG_PATH
    after: fibi-registry.service
    requires: fibi-registry.service
    environment: 
      - key: CONFIG_PATH
        value: "{{ config_path }}"

  - name: fibi-service-tracker
    port: 9904
    jar_path: /opt/microservices/fibi-service-request.jar
    after: fibi-api.service
    requires: fibi-api.service
    environment:
      - key: DB_HOST
        value: "{{ db_host }}"
      - key: DB_PORT
        value: "{{ db_port }}"
      - key: DB_USER
        value: "{{ db_user }}"
      - key: DB_PWD
        value: "{{ db_pwd }}"
      - key: DB_NAME
        value: "{{ db_name }}"
      - key: CONFIG_SERVER_URL
        value: "{{ config_server_url }}"
      - key: EUREKA_SERVER_ADDRESS
        value: "{{ eureka_server_address }}"

  - name: fibi-consumer
    port: 9906
    jar_path: /opt/microservices/fibi-consumer.jar
    after: fibi-api.service
    requires: fibi-api.service
    environment:
      - key: DB_HOST
        value: "{{ db_host }}"
      - key: DB_PORT
        value: "{{ db_port }}"
      - key: DB_USER
        value: "{{ db_user }}"
      - key: DB_PWD
        value: "{{ db_pwd }}"
      - key: DB_NAME
        value: "{{ db_name }}"
      - key: CONFIG_SERVER_URL
        value: "{{ config_server_url }}"
      - key: EUREKA_SERVER_ADDRESS
        value: "{{ eureka_server_address }}"

  - name: fibi-agreement
    port: 9907
    jar_path: /opt/microservices/fibi-agreement.jar
    after: fibi-api.service
    requires: fibi-api.service
    environment:
      - key: DB_HOST
        value: "{{ db_host }}"
      - key: DB_PORT
        value: "{{ db_port }}"
      - key: DB_USER
        value: "{{ db_user }}"
      - key: DB_PWD
        value: "{{ db_pwd }}"
      - key: DB_NAME
        value: "{{ db_name }}"
      - key: CONFIG_SERVER_URL
        value: "{{ config_server_url }}"
      - key: EUREKA_SERVER_ADDRESS
        value: "{{ eureka_server_address }}"
